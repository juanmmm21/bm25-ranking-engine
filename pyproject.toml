[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bm25-ranking-engine"
version = "0.2.0"
description = "A from-scratch implementation of the BM25 ranking algorithm for lexical relevance scoring over an inverted index."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = [
    "numpy>=1.26,<3",
]

[project.scripts]
bm25-ranking-engine = "bm25_ranking_engine.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bm25_ranking_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# NumPy publica sus stubs con sintaxis PEP 695 ("type" statement), que
# requiere python_version >= 3.12 solo para que mypy los parsee — no implica
# que este proyecto deje de soportar Python 3.11 en tiempo de ejecución
# (ver `requires-python` arriba), es una limitación de los stubs de NumPy 2.x.
python_version = "3.12"
strict = true
warn_unused_ignores = true
